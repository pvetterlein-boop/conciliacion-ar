name: Aplicar asociación de notas de crédito

on:
  push:
    paths:
      - '.github/workflows/patch-credit-note-association.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrar notas de crédito con AR
        run: |
          python3 scripts/patch_credit_note_association.py
          node --check core.js
          node --check credit-notes.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.html
          git commit -m "Asociar notas de crédito con boletas y facturas"
          git push
