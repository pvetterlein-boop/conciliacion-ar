name: Aplicar actualización Dashboard AR v2

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ar-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar dashboard, notas de crédito y caché
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/patch_dashboard.py
          python3 /tmp/patch_dashboard.py
          node --check core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.html
          git commit -m "Actualizar dashboard AR, notas de crédito y caché"
          git push
