name: Aplicar actualización Dashboard AR v2

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ar-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Actualizar dashboard, notas de crédito y caché
        shell: bash
        run: |
          echo ' nZG9jJywk e2QuaWR9KSI+Q29uY2lsaWFyPC9idXR0b24+YD onJyd9PGJ1dHRvbiBjbGFzcz0iYnRuIGxpZ2h0IiBvbmNsaWNrPSJvcGVuU2VydmljZSgnZG9jJywke2QuaWR9KSI+U2VydmljaW88L2J1dHRvbj5gO3JldHVybiBgPHRyPjx0ZD4ke2VzYyhkLmlzc3VlX2RhdGUpfTwvdGQ+PHRkPiR7ZXNjKGQuZG9jX3R5cGUpfTwvdGQ+PHRkPiR7ZC5mb2xpb308L3RkPjx0ZCBjbGFzcz0iYW1vdW50ICR7bmM/J2Rhbmdl ' | base64 -d > /tmp/patch_dashboard.py
          python3 /tmp/patch_dashboard.py
          node --check core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.html
          git commit -m "Actualizar dashboard AR, notas de crédito y caché"
          git push
