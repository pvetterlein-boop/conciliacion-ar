name: Aplicar ajuste total documentos emitidos

on:
  push:
    paths:
      - '.github/workflows/patch-dashboard-ar-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar fórmula y etiquetas de documentos emitidos
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('core.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("docsNetTotal=boletasTotal+facturasTotal+creditosTotal+otrosTotal,receivableDocs=", "docsNetTotal=boletasTotal+facturasTotal+creditosTotal,totalFiscalCount=boletas.length+facturas.length+creditos.length,receivableDocs=")
          s=s.replace("textContent='Documentos AR netos'", "textContent='Total documentos emitidos'")
          s=s.replace("<span>Documentos AR netos</span><b>${money(docsNetTotal)}</b><div class=\"subtle\">Ventas ${money(boletasTotal+facturasTotal+Math.max(0,otrosTotal))} · Notas de crédito ${money(creditosTotal)}</div>", "<span>Total documentos emitidos</span><b>${money(docsNetTotal)}</b><div class=\"subtle\">Boletas ${money(boletasTotal)} · Facturas ${money(facturasTotal)} · Notas de crédito ${money(creditosTotal)}</div>")
          s=s.replace("<tr><th>Total neto</th><th>${fiscalDocs.length}</th><th class=\"amount\">${money(docsNetTotal)}</th></tr>", "<tr><th>Total documentos emitidos</th><th>${totalFiscalCount}</th><th class=\"amount\">${money(docsNetTotal)}</th></tr>")
          s=s.replace("<tr><td>Otros documentos</td><td>${otros.length}</td><td class=\"amount\">${money(otrosTotal)}</td></tr>", "<tr><td>Otros documentos (no incluidos en total)</td><td>${otros.length}</td><td class=\"amount\">${money(otrosTotal)}</td></tr>")
          s=s.replace("Las notas de crédito se muestran restando al total de boletas y facturas.", "Total documentos emitidos = Boletas + Facturas − Notas de crédito.")
          p.write_text(s,encoding='utf-8')

          h=Path('index.html')
          x=h.read_text(encoding='utf-8')
          x=x.replace('<span>Documentos AR netos</span><b id="kMp">','<span>Total documentos emitidos</span><b id="kMp">')
          import re
          x=re.sub(r'(\./core\.js\?v=)[^"\']+',r'\g<1>20260812-9',x)
          h.write_text(x,encoding='utf-8')
          PY
          node --check core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.html
          git commit -m "Mostrar total emitido neto descontando notas de crédito"
          git push
