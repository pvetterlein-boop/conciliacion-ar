name: Integrar filtro de periodo

on:
  push:
    paths:
      - '.github/workflows/patch-period-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Validar e integrar selector de periodo
        shell: bash
        run: |
          set -euo pipefail
          node --check period-filter.js
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./period-filter.js?v=20260813-1"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html period-filter.js
          if ! git diff --cached --quiet; then
            git commit -m 'Habilitar revisión por mes y año'
            git push
          fi
