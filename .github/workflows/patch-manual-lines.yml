name: Integrar líneas manuales
on:
  push:
    paths:
      - '.github/workflows/patch-manual-lines.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e integrar módulo
        shell: bash
        run: |
          node --check manual-lines.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./manual-lines.js?v=20260813-1"></script>'
          if tag not in s:
              needle='<script src="./admin-crud.js?v=20260813-1"></script>'
              if needle not in s:
                  raise SystemExit('No se encontró el punto de inserción en index.html')
              s=s.replace(needle, needle+'\n'+tag)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Habilitar líneas manuales en fuentes AR'
            git push
          fi
