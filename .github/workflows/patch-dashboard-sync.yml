name: Integrar sincronización Dashboard

on:
  push:
    branches: [main]
    paths:
      - 'dashboard-sync.js'
      - '.github/workflows/patch-dashboard-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar e integrar Dashboard
        shell: bash
        run: |
          set -euo pipefail
          node --check dashboard-sync.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="./dashboard-sync.js?v=20260813-1"></script>'
          if tag not in s:
              s=s.replace('</body></html>', tag+'\n</body></html>')
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios pendientes'
          else
            git commit -m 'Actualizar Dashboard desde conciliaciones activas'
            git push
          fi
