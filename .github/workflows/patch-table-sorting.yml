name: Aplicar ordenamiento de tablas

on:
  push:
    paths:
      - '.github/workflows/patch-table-sorting.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Agregar ordenamiento general
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_sorting.py
          python3 /tmp/patch_sorting.py
          node --check core.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core.js index.html
          git commit -m "Agregar ordenamiento interactivo a todas las tablas"
          git push
