<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Activar usuario · Conciliación AR</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(470px,100%);background:#fff;border:1px solid #e2e7ee;border-radius:18px;padding:28px;box-shadow:0 12px 36px rgba(20,35,58,.08)}.brand{font-size:13px;font-weight:800;color:#147d73;text-transform:uppercase;letter-spacing:.05em}.corp{font-size:13px;color:#6c7787;margin-top:4px}h1{font-size:27px;margin:18px 0 8px}.lead{color:#6c7787;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input{width:100%;border:1px solid #d4dce6;border-radius:10px;padding:11px 12px;font:inherit}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;background:#147d73;color:#fff;font-weight:750;cursor:pointer;margin-top:18px}.msg{display:none;margin-top:14px;padding:11px;border-radius:9px;font-size:13px;line-height:1.45}.ok{display:block;background:#e9f7ef;color:#146738}.err{display:block;background:#fff0ee;color:#a92a20}.small{font-size:12px;color:#7b8595;margin-top:14px}.link{display:inline-block;margin-top:15px;color:#147d73;font-weight:700;text-decoration:none}
</style>
</head>
<body><div class="wrap"><div class="card"><div class="brand">Dulce Crecer</div><div class="corp">Babysmart SpA · Sistema de Conciliación AR</div><h1>Crear tu contraseña</h1><p class="lead">Completa tu invitación definiendo una contraseña personal.</p><form id="form"><div class="field"><label>Nueva contraseña</label><input id="p1" type="password" minlength="10" required autocomplete="new-password"></div><div class="field"><label>Repetir contraseña</label><input id="p2" type="password" minlength="10" required autocomplete="new-password"></div><button id="btn" class="btn" type="submit">Activar cuenta</button></form><div id="msg" class="msg"></div><div class="small">La contraseña debe tener al menos 10 caracteres. No se envía por correo ni queda almacenada en GitHub.</div></div></div>
<script>
const ENDPOINT='https://orzkndvnlrilfxdlkztf.supabase.co/functions/v1/activar-usuario-ar';
const token=new URLSearchParams(location.search).get('invite')||'';
const msg=document.getElementById('msg'),form=document.getElementById('form'),btn=document.getElementById('btn');
function show(text,ok=false){msg.className='msg '+(ok?'ok':'err');msg.innerHTML=text}
if(!token){show('Este enlace no contiene una invitación válida. Solicita una nueva invitación al administrador.');form.style.display='none'}
form.addEventListener('submit',async e=>{e.preventDefault();const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(p1!==p2)return show('Las contraseñas no coinciden.');if(p1.length<10)return show('La contraseña debe tener al menos 10 caracteres.');btn.disabled=true;btn.textContent='Activando…';try{const r=await fetch(ENDPOINT,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token,password:p1})});const raw=await r.text();let j={};try{j=JSON.parse(raw)}catch{}if(!r.ok)throw new Error(j.error||raw||'No fue posible activar la cuenta.');form.style.display='none';show('Cuenta activada correctamente.<br><a class="link" href="./">Ingresar a Conciliación AR</a>',true)}catch(err){show(err.message||'No fue posible activar la cuenta.');btn.disabled=false;btn.textContent='Activar cuenta'}});
</script></body></html>
